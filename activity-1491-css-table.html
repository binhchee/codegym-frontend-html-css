<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng dữ liệu được định kiểu với CSS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 36px 18px; color: #26334a; background: #f3f5f9; font: 16px/1.5 Arial, sans-serif; }
        main { max-width: 800px; margin: auto; padding: 28px; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px #20325016; }
        table { width: 100%; border: 1px solid #cbd3df; border-collapse: collapse; }
        caption { margin-bottom: 12px; color: #304779; font-size: 1.35rem; font-weight: 700; }
        th, td { padding: 15px; border: 1px solid #cbd3df; text-align: left; }
        th { color: white; background: #334e8c; }
        tbody tr:nth-child(even) { background: #edf1f7; }
        tbody tr:hover { background: #e0e9fb; }
    </style>
</head>
<body>
<main>
    <table>
        <caption>Danh sách học viên</caption>
        <thead><tr><th scope="col">Họ tên</th><th scope="col">Tuổi</th><th scope="col">Lớp</th></tr></thead>
        <tbody>
            <tr><td>Nguyễn Văn A</td><td>20</td><td>Web Frontend</td></tr>
            <tr><td>Trần Thị B</td><td>21</td><td>Web Frontend</td></tr>
            <tr><td>Lê Minh C</td><td>19</td><td>Web Frontend</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
