<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gộp ô trong bảng</title>
    <style>
        body { max-width: 720px; margin: 36px auto; padding: 0 18px; font: 16px/1.5 Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px; border: 1px solid #728096; text-align: left; }
        th { color: #fff; background: #304779; }
        caption { margin-bottom: 12px; font-size: 1.4rem; font-weight: 700; }
    </style>
</head>
<body>
    <table>
        <caption>Thời khóa biểu</caption>
        <thead><tr><th>Thứ</th><th>Môn học</th><th>Giáo viên</th></tr></thead>
        <tbody>
            <tr><td rowspan="2">Thứ Hai</td><td>Toán</td><td>Thầy Nam</td></tr>
            <tr><td>Văn</td><td>Cô Hạnh</td></tr>
            <tr><td>Thứ Ba</td><td colspan="2">Nghỉ học</td></tr>
        </tbody>
    </table>
</body>
</html>
