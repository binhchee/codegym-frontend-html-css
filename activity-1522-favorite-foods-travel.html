<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Món ăn yêu thích và chuẩn bị du lịch</title>
</head>
<body>
    <h1>Những món ăn yêu thích của tôi</h1>
    <ul>
        <li>Phở</li>
        <li>Bún chả</li>
        <li>Bánh mì</li>
        <li>Gỏi cuốn</li>
        <li>Chè đậu xanh</li>
    </ul>
    <h2>Các bước chuẩn bị cho một chuyến du lịch</h2>
    <ol>
        <li>Chọn địa điểm và ngày đi.</li>
        <li>Đặt vé và chỗ ở.</li>
        <li>Lên lịch trình tham quan.</li>
        <li>Chuẩn bị giấy tờ và hành lý.</li>
        <li>Kiểm tra thời tiết và khởi hành.</li>
    </ol>
</body>
</html>
