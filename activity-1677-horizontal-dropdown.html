<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu ngang có dropdown</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 40px 20px; background: #f1f3f6; color: #243044; font: 16px/1.5 Arial, sans-serif; }
        h1 { margin: 0 auto 22px; max-width: 850px; color: #263d65; }
        #menu, #menu ul { margin: 0; padding: 0; list-style: none; }
        #menu { display: flex; max-width: 850px; margin: auto; background: #222; border-radius: 7px; }
        #menu > li { position: relative; }
        #menu a { display: block; min-width: 125px; padding: 13px 18px; color: #fff; text-align: center; text-decoration: none; }
        #menu a:hover, #menu a:focus { background: #b83232; }
        #menu ul { position: absolute; z-index: 2; top: 100%; left: 0; min-width: 165px; visibility: hidden; background: #222; }
        #menu li:hover > ul, #menu li:focus-within > ul { visibility: visible; }
        #menu ul li { position: relative; }
        #menu ul ul { top: 0; left: 100%; }
        #menu ul ul { visibility: hidden; }
        @media (max-width: 560px) { body { padding-inline: 10px; } #menu a { min-width: 0; padding: 12px 10px; font-size: .9rem; } #menu ul a { min-width: 145px; text-align: left; } }
    </style>
</head>
<body>
    <h1>Explore the site</h1>
    <nav aria-label="Main navigation">
        <ul id="menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#news">News</a></li>
            <li><a href="#courses">Courses</a>
                <ul>
                    <li><a href="#html">HTML</a></li>
                    <li><a href="#css">CSS</a></li>
                    <li><a href="#web">Web development</a></li>
                </ul>
            </li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
