<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách sản phẩm</title>
    <style>
        body { max-width: 760px; margin: 40px auto; padding: 0 18px; font: 16px/1.5 Arial, sans-serif; color: #243044; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; border: 1px solid #c5ccda; text-align: left; }
        th { color: #fff; background: #35538b; }
        tbody tr:nth-child(even) { background: #f2f5fa; }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <thead><tr><th scope="col">Tên sản phẩm</th><th scope="col">Giá</th><th scope="col">Số lượng</th></tr></thead>
        <tbody>
            <tr><td>Bàn phím cơ</td><td>1.250.000 ₫</td><td>8</td></tr>
            <tr><td>Chuột không dây</td><td>520.000 ₫</td><td>14</td></tr>
            <tr><td>Màn hình 24 inch</td><td>3.490.000 ₫</td><td>5</td></tr>
            <tr><td>Tai nghe</td><td>890.000 ₫</td><td>11</td></tr>
        </tbody>
    </table>
</body>
</html>
