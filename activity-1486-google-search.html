<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form tìm kiếm</title>
</head>
<body>
    <main>
        <h1>Tìm kiếm trên Google</h1>
        <form action="https://www.google.com.vn/search" method="GET">
            <label for="query">Nhập từ khóa</label>
            <input id="query" type="search" name="q" placeholder="Nhập từ khóa" required>
            <button type="submit">Tìm kiếm</button>
        </form>
    </main>
</body>
</html>
